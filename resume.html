<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View or download Prawanrat Chaichanla's resume.">
  <meta name="theme-color" content="#f8faf9">
  <title>Resume — Prawanrat Chaichanla</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #182b36;
      --muted: #62727a;
      --teal: #2a7a8c;
      --navy: #151f4a;
      --line: #d8e2e4;
      --paper: #f8faf9;
      --white: #fff;
      --accent: #ff7235;
      --content: 1120px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", "Noto Sans Thai", sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }
    body::before, body::after {
      position: fixed;
      z-index: 11;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(42, 122, 140, .10);
      content: "";
      pointer-events: none;
    }
    body::before { left: max(24px, calc((100vw - 1280px) / 2)); }
    body::after { right: max(24px, calc((100vw - 1280px) / 2)); }
    a { color: inherit; }
    h1, h2 { margin: 0; font-family: "Manrope", "Noto Sans Thai", sans-serif; line-height: 1.2; }
    .container { width: min(var(--content), calc(100% - 48px)); margin-inline: auto; }
    .header {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(248,250,249,.96);
      backdrop-filter: blur(12px);
    }
    .nav-wrap { display: flex; min-height: 74px; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; flex-direction: column; color: var(--navy); line-height: 1.2; text-decoration: none; }
    .brand strong { font-family: "Manrope", "Noto Sans Thai", sans-serif; font-size: .96rem; letter-spacing: .04em; }
    .brand span { margin-top: 4px; color: var(--muted); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: clamp(12px, 2vw, 24px); }
    .nav-links a { color: var(--muted); font-size: .8rem; font-weight: 600; text-decoration: none; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--teal); }
    .nav-links a[aria-current="page"] { text-decoration: underline; text-underline-offset: 7px; }
    .menu-button { display: none; padding: 8px 11px; border: 1px solid var(--line); background: transparent; color: var(--navy); font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(255, 114, 53, .55); outline-offset: 3px; }
    main { padding-block: 76px 92px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      color: var(--teal);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 28px; height: 1px; background: var(--accent); content: ""; }
    .page-heading { max-width: 720px; margin-bottom: 40px; }
    .page-heading h1 { margin-bottom: 12px; color: var(--navy); font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: -.045em; }
    .page-heading p { color: var(--muted); }
    .resume-preview { width: min(100%, calc((100vh - 100px) * .707)); margin-inline: auto; overflow: hidden; border: 1px solid var(--line); background: var(--white); }
    .resume-preview iframe { display: block; width: 100%; height: min(100vh, 1100px); min-height: 640px; border: 0; }
    .resume-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 20px;
      border: 1px solid var(--teal);
      color: var(--teal);
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .button:hover, .button:focus-visible { background: var(--teal); color: var(--white); }
    .button-primary { background: var(--teal); color: var(--white); }
    .button-primary:hover, .button-primary:focus-visible { border-color: var(--navy); background: var(--navy); }
    footer { padding-block: 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 18px; }
    .text-link { color: var(--teal); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 4px; }

    @media (max-width: 1000px) {
      body::before, body::after { display: none; }
      .container { width: min(100% - 36px, var(--content)); }
      .nav-wrap { min-height: 68px; }
      .menu-button { display: inline-flex; align-items: center; gap: 8px; }
      .nav-links {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        display: none;
        align-items: stretch;
        padding: 8px 18px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .nav-links.is-open { display: flex; flex-direction: column; }
      .nav-links a { padding: 10px 0; font-size: .9rem; }
    }
    @media (max-width: 600px) {
      .container { width: min(100% - 28px, var(--content)); }
      main { padding-block: 52px 68px; }
      .page-heading { margin-bottom: 28px; }
      .resume-preview { width: 100%; }
      .resume-preview iframe { height: 85vh; min-height: 560px; }
      .resume-actions { flex-direction: column; }
      .resume-actions .button { width: 100%; }
      .footer-inner { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html#home" aria-label="Prawanrat Chaichanla, home">
        <strong>PRAWANRAT CHAICHANLA</strong>
        <span>Business Analyst · UX/UI</span>
      </a>
      <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span aria-hidden="true">☰</span> Menu
      </button>
      <nav class="nav-links" id="primary-navigation" aria-label="Primary navigation">
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#contact">Contact</a>
        <a href="resume.html" aria-current="page">Resume</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-heading">
      <p class="eyebrow">Resume</p>
      <h1>More about my experience.</h1>
      <p>View the full resume online or download the PDF.</p>
    </div>

    <div class="resume-preview">
      <iframe src="files/Resume Prawanrat Chaicahnal.pdf#page=1&zoom=Fit" title="Prawanrat Chaichanla resume PDF"></iframe>
    </div>

    <div class="resume-actions">
      <a class="button" href="index.html#resume">← Back to Portfolio</a>
      <a class="button button-primary" href="files/Resume Prawanrat Chaicahnal.pdf" download>
        Download Resume (PDF) <span aria-hidden="true">↓</span>
      </a>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© 2026 Prawanrat Chaichanla</span>
      <a class="text-link" href="index.html#home">Back to portfolio ↑</a>
    </div>
  </footer>

  <script>
    const menuButton = document.getElementById("menu-button");
    const navigation = document.getElementById("primary-navigation");

    menuButton.addEventListener("click", () => {
      const isOpen = menuButton.getAttribute("aria-expanded") === "true";
      menuButton.setAttribute("aria-expanded", String(!isOpen));
      navigation.classList.toggle("is-open", !isOpen);
    });

    navigation.addEventListener("click", (event) => {
      if (event.target instanceof HTMLAnchorElement && window.matchMedia("(max-width: 1000px)").matches) {
        menuButton.setAttribute("aria-expanded", "false");
        navigation.classList.remove("is-open");
      }
    });
  </script>
</body>
</html>
